name: Deploy Prebuilt Dist to Firebase Hosting

on:
  push:
    branches:
      - main  # deploys on every push to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - uses: actions/checkout@v3

      # 2️⃣ Check if dist folder exists
      - name: Check dist folder
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist folder is missing. Cannot deploy."
            exit 1
          fi

      # 3️⃣ Deploy to Firebase Hosting
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v1
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: imu-tracker-system
