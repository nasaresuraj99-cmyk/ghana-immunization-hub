name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify dist folder
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist folder was not created during build."
            ls -la || true
            exit 1
          fi
          echo "✅ dist folder successfully created"
          ls -la dist/

      - name: Prepare Firebase credentials
        id: sa
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is missing" >&2
            exit 1
          fi
          CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
          if printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIALS_FILE"
          elif printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > "$CREDENTIALS_FILE" 2>/dev/null \
            && jq -e . "$CREDENTIALS_FILE" >/dev/null 2>&1; then
            true
          else
            rm -f "$CREDENTIALS_FILE"
            echo "FIREBASE_SERVICE_ACCOUNT must be raw JSON or base64-encoded JSON" >&2
            exit 1
          fi
          PROJECT_ID="$(jq -r '.project_id // empty' "$CREDENTIALS_FILE")"
          if [ "$PROJECT_ID" != "imu-tracker-system" ]; then
            echo "Service account project_id must be imu-tracker-system" >&2
            rm -f "$CREDENTIALS_FILE"
            exit 1
          fi
          echo "credentials_file=$CREDENTIALS_FILE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.credentials_file }}
        run: npx --yes firebase-tools@latest deploy --only hosting --project imu-tracker-system --non-interactive

      - name: Remove temporary credentials
        if: always()
        run: rm -f "${{ steps.sa.outputs.credentials_file }}"
